# The PR report: one comment that says what a change touches, its impact, what it still needs and who
# should review it — plus labels and review requests. For a high-impact change it adds a summary for
# reviewers: each of the five answers in the description beside what the diff shows. No paid service:
# CI costs nothing (tests/verify_pr_report.py fails if a workflow calls a paid API or a paid runner).
#
# ⛔ `pull_request_target` runs with a token that can write, on pull requests from anyone. So the
#    workspace is ★the base branch★; the pull request is fetched only as git objects and read as data.
#    Nothing from the pull request is executed here. See SECURITY.md.
name: PR report

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: PR report · impact, areas, reviewers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7            # no `ref:` → the base branch, never the pull request's code
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: fetch the pull request's commits (as data)
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${NUMBER}/head:refs/remotes/pr/head"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - id: report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr_report.py --comment
