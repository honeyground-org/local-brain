# After every merge into main: was it reviewed the way GOVERNANCE.md says, or bypassed with a valid
# record (`Bypass: roster` or `Bypass: security`)? And does GitHub accept every owner in CODEOWNERS?
# A failure comments on the pull request; GitHub also logs every bypass (Settings → Rules → Insights).
name: Merge audit

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: merge audit · reviewed, or a valid bypass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr_report.py --audit
