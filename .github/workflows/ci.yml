# Every check, on every pull request, in a clean room: the tracked files only, an empty home per check.
# What is required to merge is set in the branch ruleset; GOVERNANCE.md lists it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clean-room:
    name: clean room · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Windows is measured and shown, not yet required (docs/ROADMAP.md → Quality).
    continue-on-error: ${{ matrix.informational == true }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13", pythonpath: true }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13", informational: true }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: every check, empty home
        run: python tests/clean_room.py
      - name: the same, with PYTHONPATH set (both must pass)
        if: matrix.pythonpath
        run: python tests/clean_room.py --pythonpath

  stores-live:
    name: live databases · Qdrant and Neo4j
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ["6333:6333"]
      neo4j:
        image: neo4j:5.26.31-community
        ports: ["7474:7474"]
        env:
          NEO4J_AUTH: neo4j/brain-ci-only        # a throwaway container that lives for this job
    env:
      BRAIN_TEST_QDRANT_URL: http://localhost:6333
      BRAIN_TEST_NEO4J_URL: http://localhost:7474
      NEO4J_PASSWORD: brain-ci-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: wait for both databases
        run: |
          for url in "$BRAIN_TEST_QDRANT_URL/" "$BRAIN_TEST_NEO4J_URL/"; do
            for _ in $(seq 1 90); do curl -fsS -o /dev/null "$url" && break; sleep 2; done
            curl -fsS -o /dev/null "$url" || { echo "::error::$url never answered"; exit 1; }
          done
      - name: the databases give the same answers as the local copy (a skip fails here)
        run: python tests/clean_room.py --strict verify_stores_live

  docker-stores:
    name: databases in Docker · data survives
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: start, remove and recreate the containers; nothing is re-sent (a skip fails here)
        env:
          BRAIN_TEST_DOCKER: "1"
        run: python tests/clean_room.py --strict verify_docker_stores

  gates:
    name: release gates · history, secrets, measurement code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: measurement code changed → CODE_GENERATION bumped (compared with where the change started)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) BASE="origin/$PR_BASE" ;;
            merge_group)  BASE="$QUEUE_BASE" ;;
            push)         BASE="$BEFORE" ;;
            *)            BASE="" ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            python tests/verify_code_generation.py
          else
            python tests/verify_code_generation.py --base "$BASE"
          fi
      - name: install gitleaks (pinned, checksum verified)
        env:
          V: "8.30.1"
        run: |
          cd "$RUNNER_TEMP"
          F="gitleaks_${V}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/${F}"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " ${F}\$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "$F" gitleaks
          echo "BRAIN_GITLEAKS=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
      - name: no secrets in files or history (gitleaks rules)
        run: python tests/verify_secret_scanner.py
      - name: no internal names, personal data or secrets in files and history
        env:
          BRAIN_SCRUB_TERMS: ${{ secrets.BRAIN_SCRUB_TERMS }}
        run: |
          set +e
          python tests/verify_public_scrub.py --contributors
          rc=$?
          if [ "$rc" = "77" ]; then
            echo "::notice::internal-name axes not measured — no BRAIN_SCRUB_TERMS here (normal for a fork); every other axis was"
            exit 0
          fi
          exit "$rc"
